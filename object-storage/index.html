<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S3 → GCS 이전 단계</title>
<meta name="description" content="S3 오브젝트 스토리지를 GCS로 무중단 이전하는 6단계 흐름">
<style>
:root{
  --bg:#ffffff;--surface-1:#f7f6f2;--text-primary:#1f1e1d;--text-secondary:#5f5e5a;--t:#73726c;
  --border:#e3e1da;--border-strong:#c9c7bf;--accent-bg:#e6f1fb;--accent-text:#0c447c;--accent-border:#378add;
  --warn-bg:#faeeda;--warn-text:#854f0b;--ok-bg:#eaf3de;--ok-text:#3b6d11;
  --teal-fill:#E1F5EE;--teal-stroke:#0F6E56;--teal-t:#085041;--teal-s:#0F6E56;
  --purple-fill:#EEEDFE;--purple-stroke:#534AB7;--purple-t:#3C3489;--purple-s:#534AB7;
  --gray-fill:#F1EFE8;--gray-stroke:#888780;--gray-t:#444441;--gray-s:#5F5E5A;
  --line-purple:#7F77DD;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1f1e1d;--surface-1:#2a2927;--text-primary:#f1efe8;--text-secondary:#b4b2a9;--t:#9c9a92;
    --border:#3a3936;--border-strong:#55534e;--accent-bg:#0c447c;--accent-text:#e6f1fb;--accent-border:#85b7eb;
    --warn-bg:#633806;--warn-text:#fac775;--ok-bg:#27500a;--ok-text:#c0dd97;
    --teal-fill:#085041;--teal-stroke:#5DCAA5;--teal-t:#E1F5EE;--teal-s:#9FE1CB;
    --purple-fill:#3C3489;--purple-stroke:#AFA9EC;--purple-t:#EEEDFE;--purple-s:#CECBF6;
    --gray-fill:#444441;--gray-stroke:#B4B2A9;--gray-t:#F1EFE8;--gray-s:#D3D1C7;
    --line-purple:#AFA9EC;
  }
}
:root[data-theme="dark"]{
  --bg:#1f1e1d;--surface-1:#2a2927;--text-primary:#f1efe8;--text-secondary:#b4b2a9;--t:#9c9a92;
  --border:#3a3936;--border-strong:#55534e;--accent-bg:#0c447c;--accent-text:#e6f1fb;--accent-border:#85b7eb;
  --warn-bg:#633806;--warn-text:#fac775;--ok-bg:#27500a;--ok-text:#c0dd97;
  --teal-fill:#085041;--teal-stroke:#5DCAA5;--teal-t:#E1F5EE;--teal-s:#9FE1CB;
  --purple-fill:#3C3489;--purple-stroke:#AFA9EC;--purple-t:#EEEDFE;--purple-s:#CECBF6;
  --gray-fill:#444441;--gray-stroke:#B4B2A9;--gray-t:#F1EFE8;--gray-s:#D3D1C7;
  --line-purple:#AFA9EC;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:16px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.pill{border:0.5px solid var(--border-strong);background:transparent;color:var(--text-secondary);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;font-family:inherit}
.pill.on{background:var(--accent-bg);color:var(--accent-text);border-color:var(--accent-border)}
.nav{border:0.5px solid var(--border-strong);background:transparent;color:var(--text-primary);border-radius:8px;padding:7px 16px;font-size:13px;cursor:pointer;font-family:inherit}
.nav:disabled{opacity:.4;cursor:default}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);margin:6px 0 12px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.card{border:0.5px solid var(--border);border-radius:12px;padding:14px 16px}
.card-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.ttl{font-size:16px;font-weight:500}
.tag{font-size:12px;padding:2px 8px;border-radius:8px}
.tag.stateful{background:var(--warn-bg);color:var(--warn-text)}
.tag.stateless{background:var(--ok-bg);color:var(--ok-text)}
.tag.common{background:var(--surface-1);color:var(--text-secondary)}
.card ul{margin:8px 0 10px;padding-left:20px;font-size:14px;line-height:1.7}
.meta{font-size:13px;color:var(--text-secondary);line-height:1.7}
.navrow{display:flex;justify-content:space-between;margin-top:12px}
svg text{font-family:inherit}
.th{font-size:14px;font-weight:500;fill:var(--text-primary)}
.ts{font-size:12px;fill:var(--text-secondary)}
.box{fill:var(--surface-1);stroke:var(--border-strong)}
.arr{stroke:var(--t);stroke-width:1.5;fill:none}
.c-teal>rect{fill:var(--teal-fill);stroke:var(--teal-stroke)}.c-teal>.th{fill:var(--teal-t)}.c-teal>.ts{fill:var(--teal-s)}
.c-purple>rect{fill:var(--purple-fill);stroke:var(--purple-stroke)}.c-purple>.th{fill:var(--purple-t)}.c-purple>.ts{fill:var(--purple-s)}
.c-gray>rect{fill:var(--gray-fill);stroke:var(--gray-stroke)}.c-gray>.th{fill:var(--gray-t)}.c-gray>.ts{fill:var(--gray-s)}
</style>
</head>
<body>
<main>
<h1 class="sr-only">S3에서 GCS로 오브젝트 스토리지를 무중단 이전하는 6단계 흐름</h1>
<div id="pills" class="pills"></div>
<div id="dia"></div>
<div class="legend">
  <span><span class="sw" style="background:var(--teal-fill);border:0.5px solid var(--teal-stroke)"></span>원본, 서비스 중</span>
  <span><span class="sw" style="background:var(--purple-fill);border:0.5px solid var(--purple-stroke)"></span>복사본, 동기화 중</span>
  <span><span class="sw" style="border:0.5px dashed var(--gray-stroke)"></span>미배포, 미사용, 삭제</span>
  <span>실선 = 앱 접근, 가는 점선 = 읽기 폴백, 보라 점선 = 복제</span>
</div>
<div class="card">
  <div class="card-head"><span id="ttl" class="ttl"></span></div>
  <ul id="desc"></ul>
  <div class="meta"><div>중단: <span id="down"></span></div><div>롤백: <span id="rb"></span></div></div>
</div>
<div class="navrow">
  <button id="prev" class="nav" onclick="go(cur-1)">이전</button>
  <button id="next" class="nav" onclick="go(cur+1)">다음</button>
</div>
</main>
<script>
(function(){
  var t=new URLSearchParams(location.search).get('theme');
  if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);
})();
const P=[
{n:'0. 준비',aApp:['on','읽기·쓰기 S3'],gApp:['off','미배포'],s3:['on','원본'],gcs:['off','미생성'],mid:['off','미설정'],L:{aA:1},
d:['S3 Inventory로 객체 수, 용량, 스토리지 클래스 파악. Glacier 계열은 먼저 복원해야 복사 가능','객체 URL이 DB나 앱에 하드코딩돼 있는지 확인. 있으면 Cloudflare 커스텀 도메인 뒤로 먼저 옮겨 URL을 고정','GCS 버킷과 양쪽 버킷 접근 권한 준비, 제어 VM에 rclone 설치, 이그레스 비용 추산'],dn:'없음',rb:'해당 없음'},
{n:'1. 벌크 복사',aApp:['on','읽기·쓰기 S3'],gApp:['off','미배포'],s3:['on','원본'],gcs:['rep','복사 중'],mid:['on','rclone copy'],L:{aA:1,fw:1},
d:['제어 VM의 Worker가 rclone copy로 S3 버킷 전체를 GCS로 복사','이미 같은 객체는 건너뛰므로 중단돼도 다시 실행하면 이어서 복사','Content-Type 같은 메타데이터는 따라오지만 ACL은 따라오지 않음'],dn:'없음',rb:'복사 중단 후 GCS 버킷 삭제'},
{n:'2. 증분 동기화',aApp:['on','읽기·쓰기 S3'],gApp:['off','미배포'],s3:['on','원본'],gcs:['rep','실시간 동기화'],mid:['on','SQS + 주기 실행'],L:{aA:1,fw:1},
d:['S3 이벤트 알림을 SQS로 보내고, Worker가 메시지를 읽어 해당 키만 rclone으로 GCS에 복사','이벤트 누락 대비로 주기 실행도 함께 돌림. 삭제 반영은 주기 실행의 rclone sync가 담당','DB의 CDC에 해당하는 단계'],dn:'없음',rb:'이벤트 처리와 주기 실행 중단'},
{n:'3. 카나리와 읽기 폴백',aApp:['on','읽기·쓰기 S3'],gApp:['on','읽기 GCS, 쓰기 S3'],s3:['on','원본'],gcs:['rep','실시간 동기화'],mid:['on','SQS + 주기 실행'],L:{aA:1,fw:1,gA:1,gx:1},
d:['GCP 앱은 GCS에서 읽고, 객체가 아직 없으면 S3에서 읽어 돌려줌','쓰기는 아직 S3로 보내고, 동기화가 GCS로 옮겨줌','DB가 아직 AWS를 원본으로 쓰는 카나리 단계와 같은 구조'],dn:'없음',rb:'Cloudflare 가중치를 AWS 100%로 되돌리기'},
{n:'4. 쓰기 전환',aApp:['on','쓰기 GCS'],gApp:['on','읽기·쓰기 GCS'],s3:['rep','역방향 복사본'],gcs:['on','원본'],mid:['on','rclone, 반대 방향'],L:{gA:1,gxf:1,ax:1,rv:1},
d:['DB 컷오버와 같은 시점에 모든 앱의 쓰기 대상을 GCS로 전환','마지막 정방향 동기화로 남은 객체를 따라잡고, 그 사이 빈틈은 S3 읽기 폴백이 메움','롤백 대비로 같은 rclone 엔진의 방향만 바꿔 GCS에서 S3로 역방향 동기화 시작'],dn:'없음, 객체 저장소는 쓰기 동결이 필요 없음',rb:'쓰기 대상을 S3로 되돌리기, 역방향 동기화로 최신 상태 유지'},
{n:'5. 검증과 정리',aApp:['off','삭제'],gApp:['on','읽기·쓰기 GCS'],s3:['off','삭제'],gcs:['on','원본'],mid:['off','중단'],L:{gA:1},
d:['양쪽 객체 수와 총 용량을 비교하고 rclone check로 차이 0 확인','읽기 폴백 코드 제거, 역방향 동기화 중단','안정화 기간 후 S3 버킷 삭제'],dn:'없음',rb:'이 시점부터는 롤백 불가'}
];
let cur=0;
const CL={on:'c-teal',rep:'c-purple',off:'c-gray'};
function box(x,y,w,title,s){
  const c=x+w/2,dash=s[0]==='off'?' stroke-dasharray="4 3"':'';
  return `<g class="${CL[s[0]]}"><rect x="${x}" y="${y}" width="${w}" height="56" rx="8" stroke-width="0.5"${dash}/><text class="th" x="${c}" y="${y+20}" text-anchor="middle" dominant-baseline="central">${title}</text><text class="ts" x="${c}" y="${y+38}" text-anchor="middle" dominant-baseline="central">${s[1]}</text></g>`;
}
function rep(x1,x2){
  return `<line x1="${x1}" y1="240" x2="${x2}" y2="240" stroke="var(--line-purple)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>`;
}
function render(){
  const p=P[cur],L=p.L;
  let s=`<svg width="100%" viewBox="0 0 680 320" role="img"><title>${p.n}</title><desc>${p.d.join(' ')}</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>`;
  s+=`<rect x="30" y="20" width="230" height="280" rx="16" fill="none" stroke="var(--border-strong)" stroke-width="0.5" stroke-dasharray="5 4"/><text class="th" x="46" y="42">AWS</text>`;
  s+=`<rect x="420" y="20" width="230" height="280" rx="16" fill="none" stroke="var(--border-strong)" stroke-width="0.5" stroke-dasharray="5 4"/><text class="th" x="436" y="42">GCP</text>`;
  s+=box(55,60,180,'앱 서버',p.aApp)+box(445,60,180,'앱 서버',p.gApp)+box(55,210,180,'S3',p.s3)+box(445,210,180,'GCS',p.gcs);
  s+=box(270,212,140,L.rv?'역방향 동기화':'전송 작업',p.mid);
  if(L.aA)s+=`<line x1="145" y1="118" x2="145" y2="206" class="arr" marker-end="url(#arrow)"/>`;
  if(L.gA)s+=`<line x1="535" y1="118" x2="535" y2="206" class="arr" marker-end="url(#arrow)"/>`;
  if(L.gx)s+=`<line x1="445" y1="90" x2="228" y2="206" class="arr" marker-end="url(#arrow)"/>`;
  if(L.gxf)s+=`<line x1="445" y1="90" x2="228" y2="206" class="arr" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>`;
  if(L.ax)s+=`<line x1="235" y1="90" x2="452" y2="206" class="arr" marker-end="url(#arrow)"/>`;
  if(L.fw)s+=rep(237,266)+rep(412,441);
  if(L.rv)s+=rep(443,414)+rep(268,239);
  s+='</svg>';
  document.getElementById('dia').innerHTML=s;
  document.getElementById('ttl').textContent=p.n;
  document.getElementById('desc').innerHTML=p.d.map(x=>`<li>${x}</li>`).join('');
  document.getElementById('down').textContent=p.dn;
  document.getElementById('rb').textContent=p.rb;
  document.querySelectorAll('.pill').forEach((b,i)=>b.classList.toggle('on',i===cur));
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===P.length-1;
  try{history.replaceState(null,'','#step-'+cur);}catch(e){}
}
function go(i){cur=Math.max(0,Math.min(P.length-1,i));render();}
document.getElementById('pills').innerHTML=P.map((p,i)=>`<button class="pill" onclick="go(${i})">${p.n}</button>`).join('');
const m=location.hash.match(/step-(\d)/);if(m)cur=Math.min(P.length-1,+m[1]);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
render();
</script>
</body>
</html>
